[package]
name = "damavand-manifest"
# 0.0.0 on purpose: rust-release.yaml bumps max(latest tag, this value) by the
# PR label, so the first `minor` release becomes 0.1.0.
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Module manifests (tools, named commands, egress) for damavand agent-safety crates"
license = "Apache-2.0"
repository = "https://github.com/jamshidhq/damavand-manifest"
readme = "README.md"
keywords = ["manifest", "mcp", "policy", "agent"]
categories = ["config"]

[dependencies]
regex = "1"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_norway = "0.9"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
